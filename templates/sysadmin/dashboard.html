{% extends "base.html" %}
{% block title %}Главная{% endblock %}
{% block content %}
  <h1 class="h1">Dashboard</h1>
  <div class="muted">Сводка по пользователям и ролям</div>

  <div class="row" style="margin-top: 14px;">
    <div class="card" style="flex: 1;">
      <div class="muted">Всего пользователей</div>
      <div style="font-size: 28px; font-weight: 800;">{{ total_users }}</div>
    </div>
    {% for role in role_cards %}
      <div class="card" style="flex: 1;">
        <div class="muted">{{ role.label }}</div>
        <div style="font-size: 28px; font-weight: 800;">{{ role.count }}</div>
      </div>
    {% endfor %}
  </div>

  <div class="row" style="margin-top: 14px;">
    <a class="pill" href="{% url 'sysadmin_users' %}">Пользователи →</a>
    <a class="pill" href="{% url 'sysadmin_logs' %}">Логи →</a>
  </div>
{% endblock %}
